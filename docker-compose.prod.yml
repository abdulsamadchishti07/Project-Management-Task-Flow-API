services:
  # PostgreSQL Database (Internal only)
  db:
    image: postgres:16-alpine
    container_name: taskflow_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set in production}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}"
      POSTGRES_DB: "${POSTGRES_DB:-project_managment}"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-project_managment}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Internal only)
  redis:
    image: redis:7-alpine
    container_name: taskflow_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Web API
  api:
    build: .
    container_name: taskflow_api_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-project_managment}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY must be set in production}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/ready\").read()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  postgres_prod_data:
  redis_prod_data:
